[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seatsync"
version = "1.0.0"
description = "Concurrent event ticket booking modular monolith"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "locust>=2.31,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "S101", "S105"]
