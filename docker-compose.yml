services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: seatsync
      POSTGRES_PASSWORD: seatsync
      POSTGRES_DB: seatsync
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsync"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  postgres-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: seatsync
      POSTGRES_PASSWORD: seatsync
      POSTGRES_DB: seatsync_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsync -d seatsync_test"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.0-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
  backend:
    build: ./backend
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://seatsync:seatsync@postgres:5432/seatsync
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["exports:/app/exports"]
  worker:
    build: ./backend
    command: celery -A app.notifications.tasks.celery_app worker --loglevel=info
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://seatsync:seatsync@postgres:5432/seatsync
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailhog: {condition: service_started}
    volumes: ["exports:/app/exports"]
  frontend:
    build:
      context: ./frontend
      args:
        NODE_TLS_REJECT_UNAUTHORIZED: ${FRONTEND_NODE_TLS_REJECT_UNAUTHORIZED:-1}
        PNPM_STRICT_SSL: ${FRONTEND_PNPM_STRICT_SSL:-true}
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  exports:
