name: SeatSync CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: seatsync
          POSTGRES_PASSWORD: seatsync
          POSTGRES_DB: seatsync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatsync -d seatsync_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: testing
      SECRET_KEY: ci-secret-that-is-long-enough-for-testing
      DATABASE_URL: postgresql+psycopg://seatsync:seatsync@localhost:5432/seatsync_test
      TEST_DATABASE_URL: postgresql+psycopg://seatsync:seatsync@localhost:5432/seatsync_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
